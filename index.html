function togglePerson(i){confirmModal(`确认${people[i].status==='启用'?'停用':'启用'}人员 ${people[i].name}？`,()=>{people[i].status=people[i].status==='启用'?'停用':'启用';render();toast('人员状态已更新')})}function deletePerson(i){if(people[i].ref){toast('该人员存在历史告警或任务引用，只能停用','error');return}confirmModal(`确认删除人员 ${people[i].name}？`,()=>{people.splice(i,1);render();toast('人员已删除')})}
function vehicleModal(i=-1){let v=i>=0?vehicles[i]:{plate:'',id:'',type:'内部车辆',org:'生产运行部',color:'白色',owner:'',status:'启用'};modal(`<div class="p-5 border-b border-line flex"><div class="text-lg font-semibold">${i>=0?'编辑':'新增'}车辆</div><button onclick="closeOverlay()" class="ml-auto text-xl">×</button></div><div class="p-5"><div class="grid grid-cols-2 gap-4"><label class="text-sm required">车牌 / 车辆编号<input id="vPlate" class="field w-full mt-2" value="${v.plate}"></label><label class="text-sm required">车辆类型<select id="vType" class="field w-full mt-2"><option>内部车辆</option><option>外来车辆</option><option>非机动车</option></select></label><label class="text-sm required">所属组织<select id="vOrg" class="field w-full mt-2"><option>生产运行部</option><option>设备管理部</option><option>综合管理部</option></select></label><label class="text-sm">关联人员<input id="vOwner" class="field w-full mt-2" value="${v.owner}"></label><label class="text-sm">车辆颜色<select id="vColor" class="field w-full mt-2"><option>白色</option><option>黑色</option><option>蓝色</option></select></label><label class="text-sm">车辆照片<div class="field w-full mt-2 flex items-center text-muted">＋ 选择图片</div></label></div><div class="flex justify-end gap-2 mt-6"><button onclick="closeOverlay()" class="btn btn-light">取消</button><button onclick="saveVehicle(${i})" class="btn btn-primary">保存车辆</button></div></div>`)}function saveVehicle(i){let p=$('#vPlate').value.trim();if(!p){toast('请填写车牌或车辆编号','error');return}let v={id:i>=0?vehicles[i].id:`CL-${823+vehicles.length}`,plate:p,type:$('#vType').value,org:$('#vOrg').value,color:$('#vColor').value,owner:$('#vOwner').value||'—',status:i>=0?vehicles[i].status:'启用'};if(i>=0)vehicles[i]=v;else vehicles.unshift(v);closeOverlay();render();toast('车辆保存成功')}function deleteVehicle(i){confirmModal(`确认删除车辆 ${vehicles[i].plate}？`,()=>{vehicles.splice(i,1);render();toast('车辆已删除')})}
function taskModal(ctx={}){modal(`<div class="p-5 border-b border-line flex"><div class="text-lg font-semibold">创建调度任务</div><button onclick="closeOverlay()" class="ml-auto text-xl">×</button></div><div class="p-5"><div class="grid grid-cols-2 gap-4"><label class="text-sm required">任务标题<input id="tTitle" class="field w-full mt-2" value="${ctx.title||''}" placeholder="请输入任务标题"></label><label class="text-sm required">任务类型<select id="tType" class="field w-full mt-2"><option>现场核查</option><option>应急处置</option><option>巡逻任务</option><option>设备检修</option></select></label><label class="text-sm required">执行位置<input id="tPlace" class="field w-full mt-2" value="${ctx.place||''}" placeholder="请输入位置"></label><label class="text-sm">优先级<select id="tPriority" class="field w-full mt-2"><option>中</option><option>高</option><option>低</option></select></label><label class="text-sm required">责任团组<select id="tGroup" class="field w-full mt-2"><option value="">请选择</option><option>一线值守组</option><option>设备运维组</option><option>安防巡逻组</option></select></label><label class="text-sm required">执行人员<select id="tOwner" class="field w-full mt-2"><option value="">请选择</option><option>周强</option><option>赵立新</option><option>陈海</option></select></label><label class="text-sm">执行时间<input type="datetime-local" class="field w-full mt-2" value="2026-08-19T10:00"></label><label class="text-sm">抄送人员<select class="field w-full mt-2"><option>李主任</option><option>王班长</option></select></label></div><label class="text-sm block mt-4">任务说明<textarea class="field w-full mt-2 h-20" placeholder="请输入任务要求和注意事项"></textarea></label><div class="flex justify-end gap-2 mt-6"><button onclick="closeOverlay()" class="btn btn-light">取消</button><button onclick="saveTask(${ctx.alarm??-1})" class="btn btn-primary">提交派发</button></div></div>`,'680px')}
function saveTask(alarmIndex){let title=$('#tTitle').value.trim(),place=$('#tPlace').value.trim(),g=$('#tGroup').value,o=$('#tOwner').value;if(!title||!place||!g||!o){toast('请填写所有必填项并指定执行对象','error');return}let id='RW-20260819'+String(9+tasks.length).padStart(3,'0');tasks.unshift({id,title,type:$('#tType').value,place,group:g,owner:o,priority:$('#tPriority').value,status:'已派发',time:'09:49'});if(alarmIndex>=0){alarms[alarmIndex].task=id;alarms[alarmIndex].status='处理中';alarms[alarmIndex].logs.push(['09:49:10',`任务 ${id} 已派发`])}closeOverlay();render();toast(`任务 ${id} 已创建并通知执行人`)}
function taskDetail(i){let t=tasks[i];drawer(`<div class="p-5 border-b border-line flex"><div><div class="text-lg font-semibold">${t.title}</div><div class="text-xs text-muted mt-1">${t.id}</div></div><button onclick="closeOverlay()" class="ml-auto text-xl">×</button></div><div class="p-5"><div class="flex justify-between">${statusTag(t.status)}${levelTag(t.priority)}</div><div class="grid grid-cols-2 gap-3 mt-5">${[['任务类型',t.type],['执行位置',t.place],['责任团组',t.group],['执行人员',t.owner],['创建时间',t.time],['当前状态',t.status]].map(x=>`<div class="bg-soft p-3 rounded-lg"><div class="text-xs text-muted">${x[0]}</div><div class="mt-1">${x[1]}</div></div>`).join('')}</div><div class="font-semibold mt-6">任务时间线</div><div class="border-l-2 border-blue-100 pl-4 mt-3 space-y-4"><div>09:49 系统创建并派发任务</div><div class="text-muted">等待下一步状态更新</div></div></div>`)}function advanceTask(i,s){tasks[i].status=s;render();toast(`任务已更新为${s}`)}function cancelTask(i){modal(`<div class="p-5"><div class="text-lg font-semibold">取消任务</div><textarea id="cancelReason" class="field w-full h-24 mt-4" placeholder="请输入取消原因（必填）"></textarea><div class="flex justify-end gap-2 mt-5"><button onclick="closeOverlay()" class="btn btn-light">返回</button><button onclick="saveCancel(${i})" class="btn btn-danger">确认取消</button></div></div>`)}function saveCancel(i){if(!$('#cancelReason').value.trim()){toast('请填写取消原因','error');return}tasks[i].status='已取消';closeOverlay();render();toast('任务已取消')}
function confirmModal(text,fn){window.confirmAction=fn;modal(`<div class="p-6"><div class="w-11 h-11 rounded-full bg-amber-50 text-warning grid place-items-center text-xl">!</div><div class="text-lg font-semibold mt-4">操作确认</div><div class="text-sm text-muted mt-2 leading-6">${text}</div><div class="flex justify-end gap-2 mt-6"><button onclick="closeOverlay()" class="btn btn-light">取消</button><button onclick="closeOverlay();window.confirmAction()" class="btn btn-primary">确认</button></div></div>`,'420px')}
function faceSearchModal(){modal(`<div class="p-5 border-b border-line flex"><div class="text-lg font-semibold">1:N 静态库检索</div><button onclick="closeOverlay()" class="ml-auto text-xl">×</button></div><div class="p-5"><div class="h-44 border-2 border-dashed border-line rounded-lg grid place-items-center text-center text-muted"><div><div class="text-3xl text-brand">＋</div><div class="mt-2">上传查询人脸图片</div></div></div><button onclick="toast('请先上传查询图片','error')" class="btn btn-primary w-full mt-4">开始 1:N 检索</button></div>`)}function batchImport(){toast('批量导入完成：成功 8 条，失败 2 条（照片模糊）')}function blacklistModal(type){modal(`<div class="p-5 border-b border-line flex"><div class="text-lg font-semibold">新增${type}黑名单</div><button onclick="closeOverlay()" class="ml-auto text-xl">×</button></div><div class="p-5"><label class="text-sm required">黑名单对象</label><input id="blackObj" class="field w-full mt-2" placeholder="请输入或选择对象"><label class="text-sm block mt-4 required">加入原因</label><textarea id="blackReason" class="field w-full mt-2 h-20"></textarea><label class="text-sm block mt-4 required">生效范围</label><select class="field w-full mt-2"><option>全厂区</option><option>清水池区</option><option>生产区</option></select><button onclick="if(!$('#blackObj').value||!$('#blackReason').value){toast('请填写必填项','error')}else{closeOverlay();toast('黑名单新增成功')}" class="btn btn-primary w-full mt-5">保存</button></div>`)}function generateAlarm(){alarms.unshift({id:'AL-20260819019',level:'中',type:'人工识别告警',obj:'张建国',time:'2026-08-19 09:50:00',place:'东门人行通道',source:'AI识别',status:'待处理',rule:'人工生成',task:'',logs:[['09:50:00','林志远人工生成告警']]});renderNav();toast('告警已生成并写入告警中心')}
function uploadImage(input){let f=input.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('图片格式不支持','error');return}uploaded=true;let u=URL.createObjectURL(f);$('#uploadContent').innerHTML=`<img src="${u}" class="w-28 h-28 object-cover rounded-lg mx-auto"><div class="text-xs text-brand mt-2">已上传 · 点击可更换</div>`}function runImageSearch(){if(!uploaded){toast('请先上传查询图片','error');return}$('#searchResults').innerHTML='<div class="h-[580px] flex items-center justify-center"><div class="text-center"><div class="w-10 h-10 border-4 border-blue-100 border-t-brand rounded-full animate-spin mx-auto"></div><div class="mt-3 text-muted">正在检索抓拍库…</div></div></div>';setTimeout(()=>{if(!$('#searchResults'))return;$('#searchResults').innerHTML=`<div class="flex"><div class="font-semibold">检索结果</div><div class="ml-auto text-xs text-muted">用时 1.28s · 候选 4 条</div></div><div class="grid grid-cols-3 gap-4 mt-4">${people.map((p,i)=>`<div class="border border-line rounded-lg p-3"><div class="h-32 rounded bg-gradient-to-br from-slate-200 to-blue-100 grid place-items-center text-4xl text-white">${p.name[0]}</div><div class="flex mt-3"><div><div class="font-medium">${p.name}</div><div class="text-xs text-muted mt-1">东门抓拍机 · 09:${32-i*4}</div></div><div class="ml-auto text-brand font-semibold">${96-i*7}%</div></div><div class="grid grid-cols-2 gap-2 mt-3"><button onclick="go('search');searchTab='轨迹研判'" class="btn btn-light !h-8 text-xs">查看轨迹</button><button onclick="this.textContent='已布控';this.disabled=true;toast('目标已加入布控')" class="btn btn-primary !h-8 text-xs">加入布控</button></div></div>`).join('')}</div>`},900)}
function runCollision(){let el=$('#collisionResult');el.innerHTML='<div class="text-center"><div class="w-10 h-10 border-4 border-blue-100 border-t-brand rounded-full animate-spin mx-auto"></div><div class="mt-3 text-muted">正在执行时空碰撞分析…</div></div>';setTimeout(()=>{el.innerHTML=`<div class="w-full h-full p-5"><div class="flex"><div><div class="font-semibold">碰撞结果</div><div class="text-xs text-muted mt-1">区域 A ∩ 区域 B · 90 分钟窗口</div></div><div class="ml-auto text-2xl font-semibold text-brand">3 人</div></div><div class="grid grid-cols-3 gap-4 mt-5">${people.slice(0,3).map((p,i)=>`<button onclick="personDetail(${i})" class="border border-line rounded-lg p-4 text-left hover:shadow"><div class="w-12 h-12 rounded-full bg-blue-50 text-brand grid place-items-center text-lg">${p.name[0]}</div><div class="font-medium mt-3">${p.name}</div><div class="text-xs text-muted mt-2">区域 A 08:${32+i*4}<br>区域 B 09:${12+i*5}</div><div class="text-brand text-xs mt-3">查看详情 ›</div></button>`).join('')}</div><div class="mt-5 h-64">${mapHTML()}</div></div>`},850)}
function selectCameras(){$('#cameraCount').textContent='4';$('#cameraList').innerHTML=['办公楼北侧枪机','生产区球机 03','清水池入口球机','东门车辆抓拍机'].map(x=>`<div class="flex px-3 py-2 border-b border-line"><span>${x}</span><button onclick="this.parentElement.remove();toast('已移除摄像头')" class="ml-auto text-danger">×</button></div>`).join('');calcPower()}function calcPower(){let v=Number($('#analysisType')?.value||0),count=Number($('#cameraCount')?.textContent||0),p=Math.min(95,42+v+count*2);if($('#powerText')){$('#powerText').textContent=p+'%';$('#powerBar').style.width=p+'%'}}function allocatePower(){if(!Number($('#cameraCount').textContent)||!Number($('#analysisType').value)){toast('请先框选摄像头并选择分析能力','error');return}toast('算力分配成功，4 路视频已进入分析中')}
function orgModal(name=''){modal(`<div class="p-5 border-b border-line flex"><div class="text-lg font-semibold">${name?'编辑':'新增'}组织</div><button onclick="closeOverlay()" class="ml-auto text-xl">×</button></div><div class="p-5"><label class="text-sm required">组织名称<input id="orgName" class="field w-full mt-2" value="${name}"></label><label class="text-sm block mt-4">上级组织<select class="field w-full mt-2"><option>北部水厂</option><option>水投集团</option></select></label><label class="text-sm block mt-4">负责人<input class="field w-full mt-2"></label><button onclick="if(!$('#orgName').value.trim())toast('请输入组织名称','error');else{closeOverlay();toast('组织信息已保存')}" class="btn btn-primary w-full mt-5">保存</button></div>`)}function roleModal(name=''){modal(`<div class="p-5"><div class="text-lg font-semibold">${name?'编辑':'新增'}角色</div><label class="text-sm required block mt-5">角色名称<input id="roleName" class="field w-full mt-2" value="${name}"></label><label class="text-sm block mt-4">角色说明<textarea class="field w-full h-20 mt-2"></textarea></label><button onclick="if(!$('#roleName').value)toast('请输入角色名称','error');else{closeOverlay();toast('角色已保存')}" class="btn btn-primary w-full mt-5">保存</button></div>`)}function permissionModal(name){modal(`<div class="p-5 border-b border-line flex"><div><div class="text-lg font-semibold">配置权限</div><div class="text-xs text-muted mt-1">${name}</div></div><button onclick="closeOverlay()" class="ml-auto text-xl">×</button></div><div class="p-5 grid grid-cols-2 gap-5"><div><div class="font-medium mb-3">菜单权限</div>${['综合态势','告警中心','立体防控','智能探测','动态调度','智能搜索','系统管理'].map((x,i)=>`<label class="flex items-center gap-2 py-2"><input type="checkbox" ${i<6?'checked':''} class="accent-brand">${x}</label>`).join('')}</div><div><div class="font-medium mb-3">数据权限</div>${['北部水厂（全部）','生产运行区','清水池区','办公区','北厂区'].map((x,i)=>`<label class="flex items-center gap-2 py-2"><input type="checkbox" ${i<4?'checked':''} class="accent-brand">${x}</label>`).join('')}</div></div><div class="p-5 border-t border-line flex justify-end"><button onclick="closeOverlay()" class="btn btn-light">取消</button><button onclick="closeOverlay();toast('权限已保存，将在用户重新登录后生效')" class="btn btn-primary ml-2">保存权限</button></div>`,'680px')}function testConnection(btn,fail){let old=btn.textContent;btn.textContent='测试中…';btn.disabled=true;setTimeout(()=>{btn.textContent=old;btn.disabled=false;toast(fail?'连接失败：目标主机无响应':'连接成功，延迟 32ms',fail?'error':'ok')},900)}

loginBtn.onclick=()=>{let u=loginUser.value.trim(),p=loginPass.value;userError.classList.toggle('hidden',!!u);passError.classList.toggle('hidden',!!p);loginError.classList.add('hidden');if(!u||!p)return;loginBtn.disabled=true;loginBtn.innerHTML='<span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span> 正在验证';setTimeout(()=>{loginBtn.disabled=false;loginBtn.textContent='登 录';if(u==='admin'&&p==='123456'){login.classList.add('hidden');app.classList.remove('hidden');app.classList.add('flex');render();toast('登录成功，已加载全厂区数据权限')}else{loginPass.value='';loginError.textContent=u==='disabled'?'该账号已停用，请联系管理员':'账号或密码错误';loginError.classList.remove('hidden')}},650)};
togglePass.onclick=e=>{e.preventDefault();let show=loginPass.type==='password';loginPass.type=show?'text':'password';togglePass.textContent=show?'隐藏':'显示'};function logout(){confirmModal('确认退出当前账号？',()=>{app.classList.add('hidden');app.classList.remove('flex');login.classList.remove('hidden')})}
setInterval(()=>{let d=new Date();if($('#clockTime'))$('#clockTime').textContent=d.toLocaleTimeString('zh-CN',{hour12:false});if($('#clockDate'))$('#clockDate').textContent=d.toLocaleDateString('zh-CN')},1000);
